# Production Nginx Configuration for EC2
# Handles:
# - HTTP → HTTPS redirect
# - SSL/TLS termination
# - Static file serving
# - Reverse proxy to backend API
# - Swagger documentation proxy

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    server_name wymm.online www.wymm.online _;
    
    # Allow certbot certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - Main application
server {
    listen 443 ssl;
    http2 on;
    server_name wymm.online www.wymm.online;

    # SSL Certificate Configuration
    # These files are mounted from the host via docker-compose volumes
    ssl_certificate /etc/letsencrypt/live/wymm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wymm.online/privkey.pem;
    
    # Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend static files root
    root /usr/share/nginx/html;
    index index.html;

    # ====== STATIC FILE SERVING ======
    
    # Cache busting for static assets (1 year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ====== REVERSE PROXY TO BACKEND API ======
    
    # API endpoints
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        
        # Upgrade headers for websockets (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Swagger API Documentation
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Health check endpoint (for monitoring)
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # ====== FRONTEND SPA FALLBACK ======
    
    # Single Page Application fallback
    # Any route that doesn't match static files goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== SECURITY ======
    
    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ====== LOGGING ======
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ====== GZIP COMPRESSION ======
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;
}

